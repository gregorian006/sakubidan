<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 700" font-family="system-ui, sans-serif">
  <!-- Template badan princess Saku Bidan. Tiap item outfit digambar di kanvas 300x600 yang sama, titik telapak kaki (150, 560). -->
  <rect width="650" height="700" fill="#F5EFE7"/>
  <text x="10" y="30" font-size="15" font-weight="600" fill="#2B2124">TAMPAK DEPAN (Istana, Lemari)</text>
  <text x="340" y="30" font-size="15" font-weight="600" fill="#2B2124">TAMPAK BELAKANG (saat lari)</text>

  <defs>
    <g id="panduan" font-size="11" fill="#8A4553">
      <g stroke="#8A4553" stroke-width="1" stroke-dasharray="5 4">
        <line x1="0" y1="88" x2="300" y2="88"/>
        <line x1="0" y1="280" x2="300" y2="280"/>
        <line x1="0" y1="358" x2="300" y2="358"/>
        <line x1="0" y1="515" x2="300" y2="515"/>
        <line x1="0" y1="560" x2="300" y2="560"/>
      </g>
      <text x="4" y="84">puncak kepala, jangkar topi/mahkota (150, 88)</text>
      <text x="4" y="276">bahu y=280</text>
      <text x="4" y="354">pinggang y=358</text>
      <text x="4" y="511">ujung rok y=515 (kaki harus terlihat di bawahnya)</text>
      <text x="4" y="576">telapak kaki y=560</text>
      <polygon points="108,358 192,358 258,515 42,515" fill="none" stroke="#B9A79A" stroke-width="2" stroke-dasharray="6 5"/>
    </g>
  </defs>

  <!-- tampak depan -->
  <g transform="translate(10,50)">
    <rect width="300" height="600" fill="#FFFDFA" stroke="#E2D6CB"/>
    <rect x="42" y="110" width="216" height="172" rx="62" fill="#EBB3A8"/>
    <rect x="105" y="498" width="30" height="62" rx="13" fill="#CFC5BD"/>
    <rect x="165" y="498" width="30" height="62" rx="13" fill="#CFC5BD"/>
    <rect x="76" y="305" width="20" height="90" rx="10" fill="#E9DDD4"/>
    <rect x="204" y="305" width="20" height="90" rx="10" fill="#E9DDD4"/>
    <rect x="104" y="280" width="92" height="86" rx="22" fill="#E9DDD4"/>
    <rect x="137" y="258" width="26" height="30" rx="6" fill="#E9DDD4"/>
    <circle cx="150" cy="185" r="95" fill="#F7EDE6"/>
    <ellipse cx="114" cy="200" rx="13" ry="18" fill="#B8ABA4"/>
    <ellipse cx="186" cy="200" rx="13" ry="18" fill="#B8ABA4"/>
    <path d="M50 182A100 100 0 0 1 250 182L248 225Q232 168 192 170Q170 184 150 166Q126 182 104 168Q64 168 52 225Z" fill="#EBB3A8"/>
    <use href="#panduan"/>
    <g fill="none" stroke="#8A4553" stroke-width="1.5">
      <circle cx="86" cy="398" r="7"/><circle cx="214" cy="398" r="7"/>
    </g>
    <text x="296" y="420" font-size="11" fill="#8A4553" text-anchor="end">tangan kanan (214, 398)</text>
    <text x="4" y="420" font-size="11" fill="#8A4553">tangan kiri (86, 398)</text>
  </g>

  <!-- tampak belakang -->
  <g transform="translate(340,50)">
    <rect width="300" height="600" fill="#FFFDFA" stroke="#E2D6CB"/>
    <rect x="105" y="498" width="30" height="62" rx="13" fill="#CFC5BD"/>
    <rect x="165" y="498" width="30" height="62" rx="13" fill="#CFC5BD"/>
    <rect x="76" y="305" width="20" height="90" rx="10" fill="#E9DDD4"/>
    <rect x="204" y="305" width="20" height="90" rx="10" fill="#E9DDD4"/>
    <rect x="104" y="280" width="92" height="86" rx="22" fill="#E9DDD4"/>
    <rect x="42" y="110" width="216" height="172" rx="62" fill="#EBB3A8"/>
    <circle cx="150" cy="182" r="100" fill="#EBB3A8"/>
    <use href="#panduan"/>
  </g>

  <g font-size="11" fill="#6F5F60">
    <text x="10" y="668">Kanvas tiap item: viewBox 0 0 300 600, latar transparan, titik telapak kaki (150, 560).</text>
    <text x="10" y="682">Gambar pakaiannya saja: tanpa kepala, rambut, kulit, atau kaki.</text>
    <text x="10" y="696">Abu-abu = badan, merah muda = rambut, garis putus-putus = area rok sekarang.</text>
  </g>
</svg>
